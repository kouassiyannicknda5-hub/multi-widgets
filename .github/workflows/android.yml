name: APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

# Le jeton par défaut des workflows peut être en lecture seule :
# on déclare explicitement le droit d'écrire dans l'issue de diagnostics.
permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Construire l'APK du widget natif
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle 8.9 fixe : compatible avec AGP 8.7.3 et JDK 17, quel que soit
      # le Gradle préinstallé sur le runner.
      - name: Installer Gradle 8.9
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Construire app-debug.apk et tester
        run: |
          set -o pipefail
          cd android
          gradle assembleDebug testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      # Les journaux Actions ne sont pas téléchargeables depuis le sandbox de
      # développement : en cas d'échec, on publie la fin du journal Gradle en
      # commentaire de l'issue de diagnostics, lisible depuis partout.
      - name: Publier le journal d'échec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Échec du build APK — exécution ${{ github.run_id }} :"
            echo '```'
            tail -n 100 /tmp/gradle.log || echo "(journal introuvable)"
            echo '```'
          } > /tmp/tail.md
          gh issue comment 4 --body-file /tmp/tail.md

      - name: Publier l'APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: multi-widgets-widget
          path: android/app/build/outputs/apk/debug/app-debug.apk
